<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>LunaXX explainer</title>
<style>
@font-face{font-family:Jost;src:url(../web/fonts/jost-normal-latin.woff2) format("woff2");font-weight:100 900;font-style:normal}
@font-face{font-family:Jost;src:url(../web/fonts/jost-italic-latin.woff2) format("woff2");font-weight:100 900;font-style:italic}
@font-face{font-family:Jost;src:url(../web/fonts/poppins-500-devanagari.woff2) format("woff2");font-weight:100 900;unicode-range:U+0900-097F,U+1CD0-1CF9,U+200C-200D,U+20A8,U+20B9,U+25CC,U+A830-A839,U+A8E0-A8FF}
:root{--night:#0e0e0d;--ground:#bab8b2;--white:#f4f4f1;--dim:#a9a9a3;--dim2:#6f6f69;--mag:#c2127a;--mag2:#ee5aa8}
*{box-sizing:border-box}
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#000}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;background:var(--night);font-family:Jost,sans-serif;color:var(--white);-webkit-font-smoothing:antialiased}
.scene{position:absolute;inset:0;overflow:hidden;visibility:hidden}
.abs{position:absolute}
.full{position:absolute;inset:0;width:100%;height:100%}
.h1{font-weight:600;font-size:76px;line-height:1;letter-spacing:-.02em}
.h2{font-weight:600;font-size:54px;line-height:1.05;letter-spacing:-.015em}
.lab{font-size:28px;line-height:1.3;color:var(--dim)}
.lab b{color:var(--white);font-weight:500}
.big{font-weight:500;font-size:150px;line-height:.9;letter-spacing:-.03em}
.panel{position:absolute;overflow:hidden;background:#000;outline:1px solid #3a3a37}
.panel img,.panel canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.chip{position:absolute;padding:10px 20px;border:2px solid var(--white);font-size:26px;font-weight:500;white-space:nowrap;background:rgba(14,14,13,.72)}
.hatch-mag{background:repeating-linear-gradient(-45deg,var(--mag) 0 5px,transparent 5px 13px)}
#cap{position:absolute;left:0;right:0;bottom:0;height:190px;display:flex;align-items:flex-end;justify-content:center;padding:0 180px 46px;pointer-events:none;
  background:linear-gradient(to bottom,rgba(0,0,0,0),rgba(0,0,0,.72) 58%);z-index:50}
#cap span{font-size:38px;line-height:1.3;font-weight:450;text-align:center;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.8);max-width:1500px}
#fade{position:absolute;inset:0;background:#000;z-index:60;opacity:0}
</style></head>
<body><div id="stage"><div id="cap"><span></span></div><div id="fade"></div></div>
<script src="dist/data.js"></script>
<script>
"use strict";
const ST = document.getElementById('stage');
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const eIO = p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
const eOut = p => 1 - Math.pow(1 - p, 3);
const eBack = p => { const c = 1.5; return 1 + (c + 1) * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2); };
const lerp = (a, b, p) => a + (b - a) * p;
const mk = (tag, cls, parent, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html !== undefined) e.innerHTML = html; parent.appendChild(e); return e; };
const put = (e, css) => { for (const k in css) e.style[k] = css[k]; return e; };
const byId = id => D.maps.find(m => m.id === id);
const lay = (m, k) => (m.layers.find(l => l.k === k) || {}).img;
const loadImg = src => new Promise(res => { const i = new Image(); i.onload = () => res(i); i.onerror = () => res(i); i.src = src; });
const wt = (W, re, fb = 0) => { const w = W.find(w => re.test(w.w)); return w ? w.t : fb; };
const fmtN = n => n.toLocaleString('en-IN');
const gsd = v => v >= 10 ? Math.round(v) + '' : v >= 1 ? v.toFixed(1).replace(/\.0$/, '') : v.toFixed(2);

// ------------------------------------------------------------------ terrain (the site's hero)
function u16(b64){ const s = atob(b64), a = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) a[i] = s.charCodeAt(i); return new Uint16Array(a.buffer); }
const DEM = u16(D.dem.b64), DN = D.dem.n;
class Terrain {
  constructor(W, H, lines, o = {}){
    this.W = W; this.H = H; const c = this.canvas = document.createElement('canvas'); c.width = W; c.height = H;
    this.g = c.getContext('2d'); this.img = this.g.createImageData(W, H);
    const Hf = this.Hf = new Float32Array(W * H), sc = DN / Math.max(W, H) * (o.zoom || 1), y0 = (DN - H * sc) / 2, x0 = (DN - W * sc) / 2;
    const amp = (D.dem.hi - D.dem.lo) * Math.max(W, H) / (D.dem.km * 1000) * (o.relief || .55);
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++){
      const fx = clamp(x0 + x * sc, 0, DN - 1.001), fy = clamp(y0 + y * sc, 0, DN - 1.001), ix = fx | 0, iy = fy | 0, tx = fx - ix, ty = fy - iy;
      const a = DEM[iy*DN+ix], b = DEM[iy*DN+ix+1], cc = DEM[(iy+1)*DN+ix], d = DEM[(iy+1)*DN+ix+1];
      Hf[y*W+x] = ((a*(1-tx) + b*tx)*(1-ty) + (cc*(1-tx) + d*tx)*ty) / 65535 * amp;
    }
    const rad = Math.max(1, Math.round(1 / sc / 2)), tmp = new Float32Array(W * H);
    for (let pass = 0; pass < 2; pass++){
      for (let y = 0; y < H; y++){ let acc = 0, n = 0; for (let x = -rad; x < W + rad; x++){
        if (x + rad < W){ acc += Hf[y*W + x + rad]; n++; } if (x - rad - 1 >= 0){ acc -= Hf[y*W + x - rad - 1]; n--; } if (x >= 0 && x < W) tmp[y*W + x] = acc / n; } }
      for (let x = 0; x < W; x++){ let acc = 0, n = 0; for (let y = -rad; y < H + rad; y++){
        if (y + rad < H){ acc += tmp[(y + rad)*W + x]; n++; } if (y - rad - 1 >= 0){ acc -= tmp[(y - rad - 1)*W + x]; n--; } if (y >= 0 && y < H) Hf[y*W + x] = acc / n; } }
    }
    if (o.detail){
      let seed = o.seed || 5; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
      const A = amp * o.detail;
      const layer = (cell, wgt) => { const gw = Math.ceil(W / cell) + 2, gh = Math.ceil(H / cell) + 2, g = new Float32Array(gw * gh);
        for (let i = 0; i < g.length; i++) g[i] = rnd() - .5;
        for (let y = 0; y < H; y++){ const fy = y / cell, iy = fy | 0, ty = fy - iy, sy = ty * ty * (3 - 2 * ty);
          for (let x = 0; x < W; x++){ const fx = x / cell, ix = fx | 0, tx = fx - ix, sx = tx * tx * (3 - 2 * tx);
            const a = g[iy*gw+ix], b = g[iy*gw+ix+1], c = g[(iy+1)*gw+ix], d = g[(iy+1)*gw+ix+1];
            Hf[y*W+x] += ((a*(1-sx) + b*sx)*(1-sy) + (c*(1-sx) + d*sx)*sy) * A * wgt; } } };
      [[40, 1], [20, .55], [10, .3], [5, .16], [2.5, .08]].forEach(([c, w]) => layer(c, w));
      // craters, many small and few large, as a bowl with a raised rim
      const n = o.craters || 160;
      for (let k = 0; k < n; k++){
        const r = 2.5 + (o.rmax || 30) * Math.pow(rnd(), 3.4), cx = rnd() * W, cy = rnd() * H, depth = r * .3, R2 = r * 1.6;
        for (let y = Math.max(0, cy - R2 | 0); y < Math.min(H, cy + R2 + 1); y++) for (let x = Math.max(0, cx - R2 | 0); x < Math.min(W, cx + R2 + 1); x++){
          const d = Math.hypot(x - cx, y - cy) / r; if (d > 1.6) continue;
          const h = d < 1 ? (d * d - 1) * depth + .22 * depth * Math.pow(d, 6) : .22 * depth * Math.exp(-Math.pow((d - 1) / .22, 2));
          Hf[y*W+x] += h; }
      }
    }
    let md = null;
    if (lines){
      const m = document.createElement('canvas'); m.width = W; m.height = H; const mg = m.getContext('2d');
      let fs = 400; mg.font = `700 ${fs}px Jost`;
      const widest = Math.max(...lines.map(l => mg.measureText(l).width));
      fs = Math.min(fs * W * (o.textW || .7) / widest, H * (o.textH || .3));
      mg.fillStyle = '#000'; mg.fillRect(0, 0, W, H);
      mg.filter = `blur(${Math.max(.6, fs / 110)}px)`; mg.fillStyle = '#fff'; mg.textAlign = 'center'; mg.font = `700 ${fs}px Jost`;
      const lh = fs * .98, top = H * (o.textY || .5) - lh * lines.length / 2;
      lines.forEach((l, i) => mg.fillText(l, W / 2, top + fs * .8 + i * lh));
      md = mg.getImageData(0, 0, W, H).data; this.fs = fs;
    }
    const LH = (this.fs || 0) * .075; let maxH = 0, seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    this.Alb = new Float32Array(W * H);
    for (let i = 0; i < W * H; i++){ const t = md ? md[i*4] / 255 : 0; Hf[i] += t * LH; if (Hf[i] > maxH) maxH = Hf[i]; this.Alb[i] = .78 + (rnd() - .5) * .09 + t * .05; }
    this.maxH = maxH;
    const NX = this.NX = new Float32Array(W * H), NY = this.NY = new Float32Array(W * H), NZ = this.NZ = new Float32Array(W * H);
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++){ const i = y*W + x;
      const dx = (Hf[y*W + Math.min(x+1, W-1)] - Hf[y*W + Math.max(x-1, 0)]) / 2, dy = (Hf[Math.min(y+1, H-1)*W + x] - Hf[Math.max(y-1, 0)*W + x]) / 2, n = Math.hypot(dx, dy, 1);
      NX[i] = -dx / n; NY[i] = -dy / n; NZ[i] = 1 / n; }
    this.Sh = new Float32Array(W * H); this.last = null;
  }
  render(az, el = 15){
    const key = az.toFixed(2) + '/' + el; if (key === this.last) return; this.last = key;
    const {W, H, Hf, NX, NY, NZ, Alb, Sh} = this, d = this.img.data;
    const a = az * Math.PI / 180, e = el * Math.PI / 180;
    const lx = Math.sin(a) * Math.cos(e), ly = -Math.cos(a) * Math.cos(e), lz = Math.sin(e);
    const sx = Math.sin(a), sy = -Math.cos(a), rise = Math.tan(e), byCol = Math.abs(sx) >= Math.abs(sy);
    const L = 1 / (byCol ? Math.abs(sx) : Math.abs(sy)), drop = rise * L, off = (byCol ? sy : sx) * L, sg = (byCol ? sx : sy) > 0 ? 1 : -1;
    const shadeAt = (i, cast) => { const h = Hf[i]; Sh[i] = cast > h ? cast : h;
      const lit = NX[i]*lx + NY[i]*ly + NZ[i]*lz, vis = clamp((h - cast) / .9 + .5);
      const v = lit > 0 ? Math.min(1.35, lit * vis / lz * .52) : 0, c = Math.min(255, Math.pow(Alb[i] * v, .9) * 212 + 9);
      d[i*4] = c; d[i*4+1] = c; d[i*4+2] = c * .985; d[i*4+3] = 255; };
    if (byCol) for (let n = 0; n < W; n++){ const x = sg > 0 ? W - 1 - n : n, xu = x + sg, inside = xu >= 0 && xu < W;
      for (let y = 0; y < H; y++){ let up = -1e9; if (inside){ const f = y + off; if (f >= 0 && f <= H - 1){ const iy = f | 0, t = f - iy, j = iy*W + xu; up = iy + 1 < H ? Sh[j]*(1-t) + Sh[j+W]*t : Sh[j]; } } shadeAt(y*W + x, up - drop); } }
    else for (let n = 0; n < H; n++){ const y = sg > 0 ? H - 1 - n : n, yu = y + sg, inside = yu >= 0 && yu < H;
      for (let x = 0; x < W; x++){ let up = -1e9; if (inside){ const f = x + off; if (f >= 0 && f <= W - 1){ const ix = f | 0, t = f - ix, j = yu*W + ix; up = ix + 1 < W ? Sh[j]*(1-t) + Sh[j+1]*t : Sh[j]; } } shadeAt(y*W + x, up - drop); } }
    this.g.putImageData(this.img, 0, 0);
  }
}

// ------------------------------------------------------------------ shared drawing
function hatchPattern(ctx, colour, w = 3, gap = 11, alpha = 1){
  const c = document.createElement('canvas'); c.width = c.height = gap; const g = c.getContext('2d');
  g.strokeStyle = colour; g.globalAlpha = alpha; g.lineWidth = w;
  for (let k = -1; k <= 1; k++){ g.beginPath(); g.moveTo(k * gap, gap); g.lineTo(k * gap + gap, 0); g.stroke(); }
  return ctx.createPattern(c, 'repeat');
}
function stipplePattern(ctx, colour, step = 12, r = 1.8){
  const c = document.createElement('canvas'); c.width = c.height = step; const g = c.getContext('2d');
  g.fillStyle = colour; g.beginPath(); g.arc(step / 2, step / 2, r, 0, Math.PI * 2); g.fill();
  return ctx.createPattern(c, 'repeat');
}
function cellsCanvas(size){ const c = document.createElement('canvas'); c.width = c.height = size; c.className = 'full'; return c; }
// draw an 8x8 trust map: states resolved up to `upto` cells (fractional -> fade of the next one)
function drawCells(ctx, size, cells, upto, o = {}){
  ctx.clearRect(0, 0, size, size);
  const s = size / 8, W = o.weak || (o._w = o._w || hatchPattern(ctx, 'rgba(255,255,255,.9)', 3, 13)),
        N = o.none || (o._n = o._n || stipplePattern(ctx, 'rgba(255,255,255,.9)', 13, 2.1));
  for (let i = 0; i < 64; i++){
    const x = (i % 8) * s, y = Math.floor(i / 8) * s, a = clamp(upto - i);
    if (a > 0){
      const st = cells[i].s;
      if (st !== 'verified'){ ctx.globalAlpha = a; ctx.fillStyle = st === 'weak' ? W : N; ctx.fillRect(x, y, s, s); }
      else if (a < 1 && o.flash){ ctx.globalAlpha = (1 - a) * .55; ctx.fillStyle = '#fff'; ctx.fillRect(x, y, s, s); }
      ctx.globalAlpha = 1;
    }
  }
  ctx.strokeStyle = 'rgba(255,255,255,.38)'; ctx.lineWidth = 1.5;
  for (let k = 1; k < 8; k++){ ctx.beginPath(); ctx.moveTo(k * s, 0); ctx.lineTo(k * s, size); ctx.moveTo(0, k * s); ctx.lineTo(size, k * s); ctx.stroke(); }
  if (o.cursor !== undefined && o.cursor >= 0 && o.cursor < 64){
    const i = o.cursor, x = (i % 8) * s, y = Math.floor(i / 8) * s;
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 5; ctx.strokeRect(x + 2.5, y + 2.5, s - 5, s - 5);
  }
}
function logo(size){
  return `<svg width="${size}" height="${size}" viewBox="0 0 22 22"><circle cx="11" cy="11" r="9.5" fill="#f4f4f1" stroke="#000" stroke-width="1"/><path d="M11 1.5a9.5 9.5 0 0 0 0 19c-3.2-2.4-4.6-5.8-4.6-9.5S7.8 3.9 11 1.5z" fill="#000"/></svg>`;
}
function dialSvg(az){
  const a = az * Math.PI / 180, x = 27 + 19 * Math.sin(a), y = 27 - 19 * Math.cos(a);
  let t = ''; for (let k = 0; k < 36; k++){ const b = k * Math.PI / 18, r1 = k % 9 ? 22.5 : 20.5; t += `M${27 + r1*Math.sin(b)} ${27 - r1*Math.cos(b)}L${27 + 24*Math.sin(b)} ${27 - 24*Math.cos(b)}`; }
  return `<svg width="84" height="84" viewBox="0 0 54 54"><circle cx="27" cy="27" r="24" fill="none" stroke="#f4f4f1" stroke-width="1"/><path d="${t}" stroke="#f4f4f1" stroke-width=".8"/><text x="27" y="12" text-anchor="middle" font-size="7" fill="#f4f4f1" font-family="Jost">N</text><circle cx="${x}" cy="${y}" r="4.2" fill="#fff"/></svg>`;
}

// gradient-orientation glyphs of an image, on a coarse grid, for the illumination step
async function glyphs(src, n = 34){
  const im = await loadImg(src), S = 448, c = document.createElement('canvas'); c.width = c.height = S;
  const g = c.getContext('2d'); g.drawImage(im, 0, 0, S, S); const d = g.getImageData(0, 0, S, S).data, L = new Float32Array(S * S);
  for (let i = 0; i < S * S; i++) L[i] = d[i * 4];
  const out = [], cs = S / n; let mx = 0;
  for (let cy = 0; cy < n; cy++) for (let cx = 0; cx < n; cx++){
    let gx = 0, gy = 0;
    for (let y = Math.floor(cy * cs) + 1; y < Math.floor((cy + 1) * cs) - 1; y += 1) for (let x = Math.floor(cx * cs) + 1; x < Math.floor((cx + 1) * cs) - 1; x += 1){
      const i = y * S + x, ax = L[i + 1] - L[i - 1], ay = L[i + S] - L[i - S];
      // orientation doubled so opposite gradients (a reversed Sun) point the same way
      const m = Math.hypot(ax, ay); if (m < 1) continue; const th = Math.atan2(ay, ax) * 2; gx += m * Math.cos(th); gy += m * Math.sin(th); }
    const m = Math.hypot(gx, gy); if (m > mx) mx = m; out.push({x: (cx + .5) / n, y: (cy + .5) / n, a: Math.atan2(gy, gx) / 2, m});
  }
  out.forEach(o => { o.m /= mx; }); return out;
}

// ------------------------------------------------------------------ scenes
const W06 = byId('sac_ohrc_nac_w06'), MI15 = byId('site_tc_morning_mi1548_w01'), TMC = byId('sac_ohrc_tmc_w01');
// v11: Site N (60.7°N) - OHRC -> TMC-2, NAC -> TMC-2, the OHRC of the next orbit - and TMC-2 -> IIRS on its pass
const SN_OT = byId('siten_ohrc2031_tmc20200607_c03'), SN_NT = byId('siten_nacm1282456834re_tmc20200607_c00'),
      SN_VP = byId('siten_ohrc2031_ohrc2229_c15'), SN_TI = byId('chain_tmc20200607_iirs1555_w05');
const SCENES = {};

SCENES.hook = {
  async init(r){
    const s = {};
    s.tr = new Terrain(960, 540, null, {relief: .55, zoom: 1, detail: .045, craters: 120, rmax: 30, seed: 9});
    s.tw = put(mk('div', 'full', r), {}); s.tw.appendChild(s.tr.canvas); put(s.tr.canvas, {width: '100%', height: '100%', position: 'absolute', inset: 0});
    s.dial = put(mk('div', 'abs', r), {right: '44px', top: '38px', display: 'flex', alignItems: 'center', gap: '16px', fontSize: '26px', padding: '10px 22px 10px 12px', background: 'rgba(0,0,0,.62)'});
    s.pair = put(mk('div', 'full', r), {background: 'var(--night)'});
    const P = 600;
    s.L = put(mk('div', 'panel', s.pair), {width: P + 'px', height: P + 'px', top: '150px'}); mk('img', '', s.L).src = lay(W06, 'warp');
    s.R = put(mk('div', 'panel', s.pair), {width: P + 'px', height: P + 'px', top: '150px'}); mk('img', '', s.R).src = lay(W06, 'ref');
    s.lL = put(mk('div', 'abs lab', s.pair, '<b>Chandrayaan-2 OHRC</b><br>Sun A'), {top: '772px'});
    s.lR = put(mk('div', 'abs lab', s.pair, '<b>LRO NAC</b><br>Sun B, 174° away in azimuth'), {top: '772px'});
    s.head = put(mk('div', 'abs h2', s.pair, 'Same crater. Two Suns.'), {left: '0', right: '0', top: '58px', textAlign: 'center'});
    s.blinkLab = put(mk('div', 'abs lab', s.pair, 'Same ground, every shadow reversed'), {left: 0, right: 0, top: '790px', textAlign: 'center', fontSize: '30px'});
    return s;
  },
  draw(s, t, dur, W){
    const pairAt = wt(W, /^Under/, 4.8) - .5, blinkAt = wt(W, /^same/, 6.5) - .2;
    const az = 55 + 200 * eIO(prog(t, 0, pairAt + 1.2));
    s.tr.render(az, 13);
    put(s.tw, {transform: `scale(${1.02 + .06 * prog(t, 0, pairAt + 1)})`});
    s.dial.innerHTML = dialSvg(az) + `<span>Sun at ${Math.round(((az % 360) + 360) % 360)}°<br>13° above the horizon</span>`;
    const pa = eOut(prog(t, pairAt, pairAt + .9)); put(s.pair, {opacity: pa});
    const m = eIO(prog(t, blinkAt, blinkAt + 1.0)), P = 600, gapx = 80;
    const lx = lerp(960 - P - gapx / 2, 960 - P / 2, m), rx = lerp(960 + gapx / 2, 960 - P / 2, m);
    put(s.L, {left: lx - (1 - pa) * 70 + 'px'}); put(s.R, {left: rx + (1 - pa) * 70 + 'px'});
    put(s.lL, {left: lx + 'px', opacity: 1 - m}); put(s.lR, {left: rx + 'px', opacity: 1 - m});
    const blinkOn = t > blinkAt + 1.0 ? (Math.floor((t - blinkAt - 1.0) / .55) % 2 === 0) : true;
    put(s.R, {opacity: m > 0 && m >= 1 ? (blinkOn ? 1 : 0) : 1, zIndex: 2});
    put(s.blinkLab, {opacity: eOut(prog(t, blinkAt + .8, blinkAt + 1.4))});
  }
};

SCENES.problem = {
  async init(r){
    const s = {};
    s.head = put(mk('div', 'abs h2', r, 'Three cameras. Other missions\' maps. Different Suns.'), {left: 0, right: 0, top: '120px', textAlign: 'center'});
    // the three Chandrayaan-2 cameras first, then the other missions' references
    const cards = [
      ['Chandrayaan-2 OHRC', lay(W06, 'src'), W06.a.gsd], ['Chandrayaan-2 TMC-2', lay(SN_OT, 'ref'), SN_OT.b.gsd],
      ['Chandrayaan-2 IIRS', lay(SN_TI, 'ref'), SN_TI.b.gsd], ['LRO NAC', lay(W06, 'ref'), W06.b.gsd],
      ['Kaguya TC', lay(MI15, 'src'), MI15.a.gsd], ['Kaguya MI, 1548 nm', lay(MI15, 'ref'), MI15.b.gsd]];
    s.cards = cards.map(([name, src, g], k) => {
      const c = put(mk('div', 'abs', r), {width: '250px', top: '300px', left: (960 - 3 * 280 + k * 280 + 15) + 'px'});
      const p = put(mk('div', 'panel', c), {position: 'relative', width: '250px', height: '250px'}); mk('img', '', p).src = src;
      mk('div', 'lab', c, `<b>${name}</b><br>${gsd(g)} m per pixel`).style.marginTop = '14px';

// a recorded clip of the live workbench, re-timed and framed by a camera
function clipScene(name){
  return {
    async init(r, entry){
      const s = {C: entry.clip}; s.wrap = put(mk('div', 'full', r), {transformOrigin: '0 0'});
      s.img = put(mk('img', 'full', s.wrap), {objectFit: 'cover'}); s.cur = -1;
      s.live = put(mk('div', 'chip', r, '<span style="color:#ff5a5a">●</span>&nbsp; LIVE &nbsp;<span style="font-weight:400;color:#d3d3cd">core.pipeline.run_all on a laptop CPU</span>'),
        {left: '36px', top: '32px', fontSize: '24px', padding: '8px 16px', background: 'rgba(0,0,0,.78)', zIndex: 4});
      s.badge = put(mk('div', 'chip', r), {right: '36px', top: '32px', fontSize: '24px', padding: '8px 16px', background: 'rgba(0,0,0,.78)', zIndex: 4});
      return s;
    },
    draw(s, t){
      const C = s.C, seg = C.plan.find(g => t < g.o1) || C.plan[C.plan.length - 1];
      const ct = clamp(lerp(seg.c0, seg.c1, clamp((t - seg.o0) / Math.max(1e-6, seg.o1 - seg.o0))), 0, C.frames / 30 - 1 / 30);
      const idx = Math.min(C.frames - 1, Math.round(ct * 30));
      if (idx !== s.cur){ s.cur = idx; s.img.src = `dist/clips/${name}/f_${String(idx).padStart(5, '0')}.jpg`; s.wait = s.img.decode().catch(() => {}); }
      // camera: keys {t, cx, cy, z}; each move eases over `dur` seconds from its key time
      let cx = 960, cy = 540, z = 1;
      for (const k of C.cam){ const p = eIO(prog(t, k.t, k.t + (k.d || .9))); if (p <= 0) break; cx = lerp(cx, k.cx, p); cy = lerp(cy, k.cy, p); z = lerp(z, k.z, p); }
      const hw = 960 / z, hh = 540 / z; cx = clamp(cx, hw, 1920 - hw); cy = clamp(cy, hh, 1080 - hh);
      put(s.wrap, {transform: `translate(${960 - cx * z}px, ${540 - cy * z}px) scale(${z})`});
      const sp = (seg.c1 - seg.c0) / Math.max(1e-6, seg.o1 - seg.o0);
      put(s.badge, {opacity: seg.badge && sp > 1.05 ? 1 : 0}); s.badge.innerHTML = `▶▶ &nbsp;shown at ×${sp.toFixed(1)}`;
      put(s.live, {opacity: 1});
      return s.wait;
    }
  };
}

// the real Sun sweep (one OHRC frame against 25 NAC frames), windows per bin of Sun azimuths apart, by outcome
function drawSweep(g, S){
  const B = D.bins, L = 58, R = S - 14, T = 70, Y0 = S - 138, n = B.length, bw = (R - L) / n, top = 16, y = v => Y0 - v / top * (Y0 - T);
  g.fillStyle = '#000'; g.fillRect(0, 0, S, S);
  g.font = '500 25px Jost'; g.fillStyle = '#f4f4f1'; g.fillText('Real Sun sweep: windows, by outcome', 20, 40);
  B.forEach((b, i) => { if (b.a >= 60 && b.b <= 120){ g.fillStyle = 'rgba(194,18,122,.30)'; g.fillRect(L + i * bw + 2, T - 10, bw - 4, Y0 - T + 10); } });
  g.strokeStyle = 'rgba(244,244,241,.18)'; g.lineWidth = 1; g.font = '20px Jost'; g.fillStyle = '#a9a9a3'; g.textAlign = 'right';
  [0, 8, 16].forEach(v => { g.beginPath(); g.moveTo(L, y(v)); g.lineTo(R, y(v)); g.stroke(); g.fillText(v, L - 10, y(v) + 7); });
  const hatch = hatchPattern(g, 'rgba(244,244,241,.85)', 2.5, 10), dots = stipplePattern(g, 'rgba(244,244,241,.8)', 10, 1.7);
  const kinds = [['correct_accepted', '#f4f4f1'], ['caught_failure', '#ee5aa8'], ['false_alarm', hatch], ['inconclusive', dots]];
  B.forEach((b, i) => { let acc = 0; const x = L + i * bw + bw * .2, w = bw * .6;
    kinds.forEach(([k, fill]) => { const v = b.o[k] || 0; if (!v) return; g.fillStyle = fill; g.fillRect(x, y(acc + v), w, y(acc) - y(acc + v)); acc += v; });
    g.strokeStyle = '#6f6f69'; g.strokeRect(x, y(acc), w, y(0) - y(acc));
    g.textAlign = 'center'; g.fillStyle = '#d3d3cd'; g.font = '16px Jost'; g.fillText(`${b.a}-${b.b}`, x + w / 2, Y0 + 24); });
  g.fillStyle = '#a9a9a3'; g.font = '18px Jost'; g.fillText('Sun azimuths apart, degrees', (L + R) / 2, Y0 + 50);
  const leg = [['#f4f4f1', 'accepted'], ['#ee5aa8', 'wrong, refused'], [hatch, 'right, refused'], [dots, 'images cannot judge']];
  g.textAlign = 'left'; leg.forEach(([f, l], i) => { const lx = 24 + (i % 2) * 230, ly = S - 66 + Math.floor(i / 2) * 32;
    g.fillStyle = f; g.fillRect(lx, ly, 18, 18); g.strokeStyle = '#6f6f69'; g.strokeRect(lx, ly, 18, 18);
    g.fillStyle = '#d3d3cd'; g.font = '18px Jost'; g.fillText(l, lx + 28, ly + 15); });
}

    s.dial = put(mk('div', 'abs', r), {left: '134px', top: '174px', display: 'flex', alignItems: 'center', gap: '14px', fontSize: '24px', padding: '8px 18px 8px 10px', background: 'rgba(0,0,0,.66)', zIndex: 2});
    s.cap = put(mk('div', 'abs lab', r, 'SAC\'s OHRC frame, its Sun 9.9° up, against 16 LRO images<br>chosen for their Sun alone, up to 8 windows on each'), {left: '120px', top: '796px', fontSize: '24px'});
    const H = 'repeating-linear-gradient(-45deg,#a9a9a3 0 3px,transparent 3px 9px)';
    const col = (list, x, title, sub) => {
      const head = put(mk('div', 'abs', r, `<div style="font-size:30px;font-weight:600">${title}</div><div class="lab" style="font-size:23px">${sub}</div>`), {left: x + 'px', top: '150px'});
      const rows = list.map((v, i) => { const e = put(mk('div', 'abs', r), {left: x + 'px', top: (700 - i * 56) + 'px', display: 'flex', alignItems: 'center', gap: '14px', height: '44px'});
        mk('div', '', e, (v.el >= 0 ? '+' : '−') + Math.abs(v.el).toFixed(1) + '°').style.cssText = 'width:92px;text-align:right;font-size:24px;color:#d3d3cd;font-variant-numeric:tabular-nums';
        const box = put(mk('div', '', e), {display: 'flex', gap: '5px'});
        const sq = [...Array(v.n)].map((_, k) => put(mk('div', '', box), {width: '28px', height: '28px', border: '2px solid #4a4a46', background: k < v.ok ? '#f4f4f1' : H, opacity: 0}));
        const cnt = mk('div', '', e, `${v.ok}/${v.n}`); cnt.style.cssText = 'font-size:24px;font-weight:500;font-variant-numeric:tabular-nums;opacity:0';
        return {e, sq, cnt, v}; });
      const n = list.reduce((a, v) => a + v.n, 0), ok = list.reduce((a, v) => a + v.ok, 0);
      const tot = put(mk('div', 'abs', r, `${ok} of ${n} <span style="font-size:26px;font-weight:400;color:#a9a9a3">accepted</span>`), {left: x + 'px', top: '762px', fontSize: '42px', fontWeight: 600, opacity: 0});
      return {head, rows, tot};
    };
    s.A = col(D.ladder.filter(v => v.az < 90).sort((a, b) => a.el - b.el), 800, 'Sun raised, azimuth within 20°', 'Δ elevation of each LRO image');
    s.B = col(D.ladder.filter(v => v.az >= 90).sort((a, b) => a.el - b.el), 1330, 'Sun on the opposite side', '155–177° in azimuth, then raised');
    return s;
  },
  draw(s, t, dur, W){
    const cR = wt(W, /^Raised/, 5.3) - .4, c61 = wt(W, /^sixty-one/, 7.4), cO = wt(W, /^Turned/, 10.4) - .4, c48 = wt(W, /^forty-eight/, 13.4);
    put(s.h, {opacity: eOut(prog(t, 0, .6))}); put(s.cap, {opacity: eOut(prog(t, .4, 1))}); put(s.tw, {opacity: eOut(prog(t, 0, .7))});
    put(s.A.head, {opacity: eOut(prog(t, .6, 1.2))}); put(s.B.head, {opacity: eOut(prog(t, cO - .2, cO + .4))});
    // the Sun: the OHRC's own (azimuth 270.9°, 9.9° up) raised by 41.7° as its azimuth drifts 19°,
    // then swung to the other side (176.8° away, 1.6° lower) and raised again to +47.0° (154.7° away)
    const AZ = 270.9, EL = 9.9, r1 = [cR, c61 + .6], r2 = [cO + 1.1, c48 + .4];
    const p1 = prog(t, r1[0], r1[1]), sw = eIO(prog(t, cO, cO + 1.1)), p2 = prog(t, r2[0], r2[1]);
    let az = AZ + 19.2 * p1, el = EL + 43.3 * p1 - 1.6;
    if (sw > 0){ az = lerp(AZ + 19.2, AZ - 176.8, sw); el = lerp(EL + 41.7, EL - 1.6, sw); }
    if (p2 > 0){ az = AZ - lerp(176.8, 154.7, p2); el = EL + lerp(-1.6, 47.0, p2); }
    s.tr.render(az, el);
    s.dial.innerHTML = dialSvg(az) + `<span>Sun ${Math.round(el)}° above the horizon</span>`;
    put(s.dial, {opacity: eOut(prog(t, .2, .8))});
    // each row fills when the Sun reaches its elevation
    const fill = (C, t0, t1, lo, hi) => C.rows.forEach(R => { const tr = t0 + (t1 - t0) * clamp((R.v.el - lo) / (hi - lo));
      put(R.e, {opacity: t >= t0 - .6 ? .35 + .65 * clamp((t - tr) / .25) : 0});
      R.sq.forEach((q, k) => put(q, {opacity: clamp((t - tr - k * .035) / .12)})); R.cnt.style.opacity = clamp((t - tr - .35) / .2); });
    fill(s.A, r1[0], r1[1], -1.6, 41.7); fill(s.B, r2[0], r2[1], -1.6, 47.0);
    put(s.A.tot, {opacity: eOut(prog(t, c61 - .3, c61 + .3))}); put(s.B.tot, {opacity: eOut(prog(t, c48 - .3, c48 + .3))});
  }
};

    put(s.note, {opacity: eOut(prog(t, cw[3] + .4, cw[3] + 1))});
    const pp = eOut(prog(t, 0, .8)); put(s.ph, {opacity: pp, transform: `translateY(${(1 - pp) * 60}px)`});

// ------------------------------------------------------------------ timeline, captions, seek
const TLN = TL.scenes;
const roots = {}, states = {};
function phrases(cap, words, voice){
  const parts = cap.split(/(?<=[.,:;?!])\s+/).reduce((acc, p) => { if (acc.length && (acc[acc.length - 1].length + p.length < 62)) acc[acc.length - 1] += ' ' + p; else acc.push(p); return acc; }, []);
  const total = parts.reduce((a, p) => a + p.split(/\s+/).length, 0); let k = 0;
  return parts.map(p => { const n = p.split(/\s+/).length, i0 = Math.floor(k / total * words.length); k += n;
    return {p, t: words.length ? words[Math.min(words.length - 1, i0)].t : 0}; });
}
async function init(){
  await document.fonts.load('600 80px Jost'); await document.fonts.load('italic 400 30px Jost');
  for (const e of TLN){
    const r = mk('div', 'scene', ST); r.dataset.scene = e.scene; ST.insertBefore(r, document.getElementById('cap'));
    roots[e.scene] = r; states[e.scene] = await SCENES[e.scene].init(r, e);
    e.ph = phrases(e.cap, e.words, e.voice);
  }
  await Promise.all([...document.images].map(i => i.decode().catch(() => {})));
}
const READY = init();
const FADE = .35;
window.FILM = {
  ready: READY,
  duration: TL.duration,
  async seek(T){
    await READY;
    const waits = []; let capText = '', capA = 0;
    TLN.forEach((e, i) => {
      const a0 = e.start - (i ? FADE : 0), a1 = e.start + e.dur + (i < TLN.length - 1 ? FADE : 0), r = roots[e.scene];
      if (T < a0 || T > a1){ r.style.visibility = 'hidden'; return; }
      const fi = i ? clamp((T - a0) / (2 * FADE)) : 1, fo = i < TLN.length - 1 ? clamp((a1 - T) / (2 * FADE)) : 1;
      r.style.visibility = 'visible'; r.style.opacity = Math.min(fi, fo); r.style.zIndex = i;
      const w = SCENES[e.scene].draw(states[e.scene], Math.max(0, T - e.start), e.dur, e.words); if (w) waits.push(w);
      if (T >= e.start && T < e.start + e.dur){ const lt = T - e.start, ph = e.ph.filter(p => lt >= p.t - .05).pop();
        if (ph && lt < e.voice + e.vdur + .15){ capText = ph.p; capA = clamp((lt - ph.t + .05) / .18); } }
    });
    const cap = document.querySelector('#cap span'); if (cap.textContent !== capText) cap.textContent = capText;
    document.getElementById('cap').style.opacity = capText && location.hash !== '#nocap' ? 1 : 0; cap.style.opacity = capA;
    document.getElementById('fade').style.opacity = Math.max(1 - clamp(T / .6), clamp((T - (TL.duration - 1.2)) / 1.2));
    await Promise.all(waits);
    await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
    return true;
  }
};
