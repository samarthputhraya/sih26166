# Without this, bare `pytest core evaluation app` fails with six collection
# errors - `ModuleNotFoundError: No module named 'core'` - while
# `python -m pytest core evaluation app` passes all 130. The difference is that
# `python -m` puts the current directory on sys.path and a bare `pytest` does not.
#
# That gap is a trap for teammates: the failing invocation is the shorter one, and
# the conclusion it invites is "Samartha's module is broken" rather than "the
# runner cannot see the repo root". There is no core/__init__.py and no other
# config file in this repo, so this is the whole fix.
[pytest]
pythonpath = .
testpaths = core evaluation app baselines
