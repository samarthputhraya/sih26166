# `pythonpath = .` lets a bare `pytest` import the top-level packages (core, evaluation, ops, ...).
# Without it a bare `pytest` fails to collect with `ModuleNotFoundError: No module named 'core'`,
# while `python -m pytest` passes: `python -m` puts the current directory on sys.path and a bare
# `pytest` does not.
[pytest]
pythonpath = .
testpaths = core evaluation app baselines ops web
